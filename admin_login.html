{% extends "base.html" %}
{% block title %}Login Admin · Kantin Bersih UNPAM{% endblock %}
{% block content %}
<div class="container">
  <div class="panel login-card">
    <span class="eyebrow">AREA ADMIN</span>
    <h1 class="page-title" style="margin-top:14px">Masuk dashboard</h1>
    <p class="subtext">Admin dapat mengubah status dan menghapus laporan.</p>
    <form method="post">
      <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" style="width:100%;margin-top:8px">Masuk</button>
    </form>
    <p class="hint" style="margin-top:15px">Login awal: <strong>admin</strong> / <strong>unpam123</strong>. Ganti sebelum dipublikasikan.</p>
  </div>
</div>
{% endblock %}
